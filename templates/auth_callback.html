<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Authenticating – PathForge</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#d4af37;font-family:Arial,sans-serif}.card{width:min(92vw,460px);padding:40px;text-align:center;border:1px solid #d4af3755;border-radius:20px;background:#111;box-shadow:0 12px 40px #000}.logo{width:72px;height:72px}.message{color:#aaa}.spinner{width:52px;height:52px;margin:25px auto;border:4px solid #d4af3725;border-top-color:#d4af37;border-radius:50%;animation:spin 1s linear infinite}.error{color:#ff7373;display:none}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/static/assets/icons/main%20icon.svg" alt="PathForge">
    <h1>Authenticating…</h1>
    <p class="message" id="message">Please wait while we securely log you in.</p>
    <div class="spinner" id="spinner" aria-label="Loading"></div>
    <p class="error" id="error" role="alert"></p>
  </main>
  <script>
    (async () => {
      const message = document.getElementById('message');
      const spinner = document.getElementById('spinner');
      const errorBox = document.getElementById('error');
      try {
        const params = new URLSearchParams(location.hash.slice(1));
        const providerError = params.get('error_description') || params.get('error');
        if (providerError) throw new Error(providerError);
        const accessToken = params.get('access_token');
        if (!accessToken) throw new Error('No authentication token was returned. Please try again.');
        const response = await fetch('/api/auth/session', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            access_token: accessToken,
            refresh_token: params.get('refresh_token')
          })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.error || 'Authentication failed.');
        history.replaceState(null, '', location.pathname);
        message.textContent = 'Success! Redirecting…';
        spinner.hidden = true;
        location.replace(result.redirect || '/dashboard');
      } catch (error) {
        spinner.hidden = true;
        message.textContent = 'Authentication failed';
        errorBox.textContent = error.message;
        errorBox.style.display = 'block';
        setTimeout(() => location.replace('/login'), 3500);
      }
    })();
  </script>
</body>
</html>
