<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathForge - Sign In</title>
    <link rel="icon" href="/favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background:
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.3),
                            0 0 40px rgba(212, 175, 55, 0.1);
            }
            50% {
                box-shadow: 0 0 30px rgba(212, 175, 55, 0.5),
                            0 0 60px rgba(212, 175, 55, 0.2);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out, glow 3s ease-in-out infinite;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
            animation: fadeIn 0.8s ease-out;
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            margin-bottom: 8px;
            animation: fadeIn 1s ease-out;
        }

        .subtitle {
            text-align: center;
            color: rgba(212, 175, 55, 0.8);
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: fadeIn 1.2s ease-out;
        }

        .oauth-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .oauth-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .oauth-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .oauth-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .oauth-button:active {
            transform: scale(0.98);
        }

        .google-button {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #D4AF37;
            border: 2px solid #D4AF37;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(212, 175, 55, 0.3);
            animation: fadeIn 1.4s ease-out;
        }

        .google-button:hover {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            color: #FFD700;
            border-color: #FFD700;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8),
                        0 0 30px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }

        .facebook-button {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #D4AF37;
            border: 2px solid #D4AF37;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(212, 175, 55, 0.3);
            animation: fadeIn 1.6s ease-out;
        }

        .facebook-button:hover {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            color: #FFD700;
            border-color: #FFD700;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.8),
                        0 0 30px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }

        .icon {
            font-size: 20px;
            position: relative;
            z-index: 1;
        }

        .button-text {
            position: relative;
            z-index: 1;
        }

        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #D4AF37;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-button:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #D4AF37;
            transform: translateX(-5px);
        }

        .divider {
            text-align: center;
            margin: 25px 0 20px;
            color: rgba(212, 175, 55, 0.5);
            font-size: 13px;
            animation: fadeIn 1.8s ease-out;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: rgba(158, 158, 158, 0.8);
            font-size: 12px;
            animation: fadeIn 2s ease-out;
        }

        .footer-text a {
            color: #D4AF37;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-text a:hover {
            color: #FFD700;
        }

        .login-form input[type="email"],
        .login-form input[type="password"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            animation: fadeIn 1.2s ease-out;
        }

        .login-form input[type="email"]:focus,
        .login-form input[type="password"]:focus {
            outline: none;
            border-color: #D4AF37;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .login-form input[type="email"]::placeholder,
        .login-form input[type="password"]::placeholder {
            color: rgba(212, 175, 55, 0.5);
        }

        .login-form button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #D4AF37 0%, #FFD700 50%, #D4AF37 100%);
            color: #000;
            border: none;
            font-weight: 700;
            margin-bottom: 10px;
            animation: fadeIn 1.4s ease-out;
        }

        .login-form button[type="submit"]:hover {
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 50%, #FFD700 100%);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6);
            transform: translateY(-3px);
        }

        .signup-link {
            text-align: center;
            margin-top: 15px;
            color: rgba(158, 158, 158, 0.8);
            font-size: 13px;
            animation: fadeIn 2.2s ease-out;
        }

        .signup-link a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #FFD700;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
                max-width: 95%;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 13px;
            }

            .oauth-button {
                padding: 12px 18px;
                font-size: 14px;
            }

            .back-button {
                top: 20px;
                left: 20px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='/'">←</button>

    <div class="container">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='assets/icons/main icon.svg') }}" alt="PathForge Logo">
        </div>

        <h1 class="title">PATHFORGE</h1>
        <p class="subtitle">Sign in to continue your journey</p>

        <!-- Email/Password Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form" style="margin-bottom: 20px;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group" style="margin-bottom: 15px;">
                <input type="email" name="email" id="email" required placeholder="Email">
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <input type="password" name="password" id="password" required placeholder="Password">
            </div>

            <div class="form-group" style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" name="remember_me" id="remember_me" value="1"
                       style="width: auto; height: 18px; cursor: pointer; accent-color: #D4AF37;">
                <label for="remember_me" style="color: rgba(212, 175, 55, 0.8); font-size: 14px; cursor: pointer; margin: 0;">
                    Keep me signed in for 30 days
                </label>
            </div>

            <button type="submit" class="oauth-button">
                <span class="button-text">Sign In</span>
            </button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a>
        </div>

        <div class="divider">
            Or continue with
        </div>

        <div class="oauth-container">
            <button type="button" class="oauth-button google-button" onclick="signInWithGoogle()">
                <span class="icon"><i class="fab fa-google"></i></span>
                <span class="button-text">Continue with Google</span>
            </button>

            <button type="button" class="oauth-button facebook-button" onclick="signInWithFacebook()">
                <span class="icon"><i class="fab fa-facebook-f"></i></span>
                <span class="button-text">Continue with Facebook</span>
            </button>
        </div>

        <div class="footer-text">
            By continuing, you agree to PathForge's<br>
            <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </div>
    </div>

    <script>
        // Prevent double-submission of login form
        const loginForm = document.querySelector('.login-form');
        const submitButton = loginForm.querySelector('button[type="submit"]');
        let isSubmitting = false;

        loginForm.addEventListener('submit', function(e) {
            if (isSubmitting) {
                e.preventDefault();
                return false;
            }

            isSubmitting = true;
            submitButton.disabled = true;
            submitButton.style.opacity = '0.6';
            submitButton.style.cursor = 'not-allowed';

            const originalText = submitButton.querySelector('.button-text').textContent;
            submitButton.querySelector('.button-text').textContent = 'Signing in...';

            // Re-enable after 5 seconds as fallback (in case of error)
            setTimeout(() => {
                if (isSubmitting) {
                    isSubmitting = false;
                    submitButton.disabled = false;
                    submitButton.style.opacity = '1';
                    submitButton.style.cursor = 'pointer';
                    submitButton.querySelector('.button-text').textContent = originalText;
                }
            }, 5000);
        });

        // Sign in with Google
        function signInWithGoogle() {
            console.log('Redirecting to Google OAuth...');
            window.location.href = '{{ url_for("auth.login_google") }}';
        }

        // Sign in with Facebook
        function signInWithFacebook() {
            console.log('Redirecting to Facebook OAuth...');
            window.location.href = '{{ url_for("auth.login_facebook") }}';
        }
    </script>
</body>
</html>
